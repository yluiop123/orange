server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: ORANGE-BOOT
  datasource:
    # 连接串优先级：SPRING_DATASOURCE_URL > DB_URL > DB_HOST/DB_PORT/DB_NAME
    # 引擎由 DB_DRIVER（postgres/mysql/mariadb/sqlite）或 JDBC URL 自动识别。
    # 未配置时保持 PostgreSQL 默认值，见 DatabaseSettings。
    url: ${SPRING_DATASOURCE_URL:${DB_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
    # 数据库密码，从环境变量中获取；未设置时按引擎取默认值（postgres/postgres、root/root）
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    # HikariCP 特有配置
    hikari:
      # 连接池中允许的最大连接数（推荐值：CPU核数 * 2 + 1）
      maximum-pool-size: 10
      # 连接池中维护的最小空闲连接数
      minimum-idle: 5
      # 等待连接池分配连接的最大时长（毫秒），超过此时间将抛出异常
      connection-timeout: 30000
      # 一个连接在池里闲置的最大时间
      idle-timeout: 600000
      # 一个连接在池里的最大存活时间（需小于数据库自身的 wait_timeout）
      max-lifetime: 1800000
      # 用于测试连接是否有效的 SQL
      connection-test-query: SELECT 1
  jpa:
#    hibernate:
#      ddl-auto: update   # 开发用：update / create / validate
    show-sql: ${SPRING_SHOW_SQL:${SHOW_SQL:false}}
    # 方言由 DatabaseConfig 根据 DB_DRIVER/URL 自动注入，不要在此写死。
    hibernate:
      # 表结构由 database/<engine>/ddl.sql 管理，应用不建表。
      ddl-auto: none
  cache:
    type: caffeine
    cache-names:
      - group
    caffeine:
      spec: initialCapacity=100,maximumSize=10000,expireAfterWrite=30m,recordStats
jwt:
  # RS256（推荐）：RSA PEM 内容或文件路径；两项同时设置时优先于 JWT_SECRET。
  # 生成密钥：用 OpenSSL 生成 RSA 密钥对，见 backend/README.md
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  access-expire: ${JWT_ACCESS_EXPIRE:900}        # 15分钟
  refresh-expire: ${JWT_REFRESH_EXPIRE:604800}   # 7天
  issuer: ${JWT_ISSUER:orange}
  # 未配置密钥时回退到 HS256，读取环境变量 JWT_SECRET（开发默认值见 JwtKeyConfig）。
springdoc:
  # Swagger is generated from the controller/DTO annotations at runtime.
  # /openapi.json is the generated document; /swagger is its UI.
  # It stays enabled in every profile; set SPRINGDOC_ENABLED=false to hide both.
  swagger-ui:
    path: /swagger
    enabled: ${SPRINGDOC_ENABLED:true}
  api-docs:
    path: /openapi.json
    enabled: ${SPRINGDOC_ENABLED:true}
  # Only scan the HTTP layer; entities/repositories must not leak into the schema.
  packages-to-scan: com.orange.controller
app:
  operation-log:
    # 操作日志保留天数，过期日志每天凌晨清理
    retention-days: ${LOG_RETENTION_DAYS:${OPERATION_LOG_RETENTION_DAYS:90}}
    cleanup-cron: ${OPERATION_LOG_CLEANUP_CRON:0 30 3 * * *}
  cors:
    # 允许跨域访问的来源，逗号分隔。
    # 本地开发默认 http://localhost:3000；生产通过环境变量覆盖，例如：
    # CORS_ALLOWED_ORIGINS=https://orange.example.com
    allowed-origins: ${CORS_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4200}}
  auth:
    # refresh token Cookie 是否只允许 HTTPS。生产必须设为 true。
    cookie-secure: ${COOKIE_SECURE:false}
    # 同站部署用 Lax；跨站部署需要 None + Secure，并注意浏览器对第三方 Cookie 的限制。
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    # 可选：跨子域共享 refresh Cookie 时设置，例如 .example.com
    cookie-domain: ${COOKIE_DOMAIN:}
    # 登录失败限流：单账号阈值、单 IP 阈值、锁定时长（分钟）
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:20}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}

