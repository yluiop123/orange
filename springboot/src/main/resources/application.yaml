spring:
  server:
    port: 8080
  application:
    name: ORANGE-BOOT
  datasource:
    url: jdbc:postgresql://localhost:5432/orange
    username: postgres
    # 数据库密码，从环境变量中获取，本地开发取默认值 postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    # HikariCP 特有配置
    hikari:
      # 连接池中允许的最大连接数（推荐值：CPU核数 * 2 + 1）
      maximum-pool-size: 10
      # 连接池中维护的最小空闲连接数
      minimum-idle: 5
      # 等待连接池分配连接的最大时长（毫秒），超过此时间将抛出异常
      connection-timeout: 30000
      # 一个连接在池里闲置的最大时间
      idle-timeout: 600000
      # 一个连接在池里的最大存活时间（需小于数据库自身的 wait_timeout）
      max-lifetime: 1800000
      # 用于测试连接是否有效的 SQL
      connection-test-query: SELECT 1
  jpa:
#    hibernate:
#      ddl-auto: update   # 开发用：update / create / validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  cache:
    type: caffeine
    cache-names:
      - group
    caffeine:
      spec: initialCapacity=100,maximumSize=10000,expireAfterWrite=30m,recordStats
jwt:
  private-key: classpath:keys/private_key.pem
  public-key: classpath:keys/public_key.pem
  access-expire: 900        # 15分钟
  refresh-expire: 604800    # 7天
springdoc:
  swagger-ui:
    # 自定义 Swagger UI 的访问地址，默认是 /swagger-ui.html
    path: /swagger-ui.html
    # 启用尝试功能（Try it out）
    enabled: true
  api-docs:
    # OpenAPI 描述文件的路径，默认是 /v3/api-docs
    path: /api-docs
  # 只扫描特定的包
  packages-to-scan: com.orange.controller
app:
  operation-log:
    # 操作日志保留天数，过期日志每天凌晨清理
    retention-days: ${OPERATION_LOG_RETENTION_DAYS:90}
    cleanup-cron: ${OPERATION_LOG_CLEANUP_CRON:0 30 3 * * *}
  cors:
    # 允许跨域访问的来源，逗号分隔。
    # 本地开发默认 http://localhost:3000；生产通过环境变量覆盖，例如：
    # CORS_ALLOWED_ORIGINS=https://orange.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # refresh token Cookie 是否只允许 HTTPS。生产必须设为 true。
    cookie-secure: ${COOKIE_SECURE:false}
    # 同站部署用 Lax；跨站部署需要 None + Secure，并注意浏览器对第三方 Cookie 的限制。
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    # 可选：跨子域共享 refresh Cookie 时设置，例如 .example.com
    cookie-domain: ${COOKIE_DOMAIN:}
    # 登录失败限流：单账号阈值、单 IP 阈值、锁定时长（分钟）
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:20}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}

