# 一个简单的 GitHub Pages 部署工作流
name: Deploy static content to Pages

on:
  # 仅在推送到默认分支时运行
  push:
    branches: ['main']

  # 这个选项可以使你手动在 Action tab 页面触发工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests compile
        working-directory: backend/springboot
      - name: Security tests
        run: >-
          mvn -B
          -Dtest=JwtUtilTest,PermissionAuthorityBuilderTest,LoginAttemptServiceTest,SecurityResponseWriterTest,SecurityIntegrationTest
          test
        working-directory: backend/springboot

  # 单次部署的工作描述
  deploy:
    env:
      VITE_PLATFORM: github
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: './frontend/react/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/react
      - name: Lint
        run: pnpm run lint
        working-directory: frontend/react
      - name: Type check
        run: pnpm run typecheck
        working-directory: frontend/react
      - name: Test
        run: pnpm run test
        working-directory: frontend/react
      - name: Check permission seed
        run: pnpm run db:seed:check
        working-directory: frontend/react
      - name: Build
        run: pnpm run build:github
        working-directory: frontend/react
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只部署 React 前端
          path: './frontend/react/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
